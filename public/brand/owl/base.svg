  <!-- Feet -->
  <ellipse cx="68" cy="154" rx="8" ry="3" fill="var(--owl-body, #003449)"/>
  <ellipse cx="92" cy="154" rx="8" ry="3" fill="var(--owl-body, #003449)"/>
